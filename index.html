<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>भारत न्यूज़ 24x7 | ताज़ा ख़बरें</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;600;700;800&family=Poppins:wght@600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans Devanagari', sans-serif; }
        .logo-font { font-family: 'Poppins', sans-serif; }
        ::-webkit-scrollbar { height: 6px; width: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #e11d48; border-radius: 10px; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">

    <!-- Header -->
    <header class="bg-slate-900/90 backdrop-blur-md border-b border-slate-800 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center gap-3 cursor-pointer" onclick="loadNews('MAIN')">
                <span class="relative flex h-4 w-4">
                  <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-rose-500 opacity-75"></span>
                  <span class="relative inline-flex rounded-full h-4 w-4 bg-rose-600"></span>
                </span>
                <h1 class="text-2xl md:text-3xl font-extrabold logo-font tracking-tight text-white">
                    BHARAT <span class="bg-gradient-to-r from-rose-500 to-orange-500 bg-clip-text text-transparent">NEWS</span>
                </h1>
            </div>
            
            <button onclick="loadNews(currentCategory)" class="text-xs bg-rose-600 hover:bg-rose-700 text-white font-bold px-3 py-1.5 rounded-full transition-all flex items-center gap-1 shadow">
                🔄 रीफ़्रेश फ़ीड
            </button>
        </div>
        
        <!-- Navigation Tabs -->
        <nav class="border-t border-slate-800/60 bg-slate-900/50 overflow-x-auto">
            <div class="max-w-7xl mx-auto flex whitespace-nowrap px-4 py-2 gap-2">
                <button onclick="changeCategory('MAIN', this)" class="nav-btn px-4 py-1.5 text-xs md:text-sm font-bold rounded-full bg-rose-600 text-white shadow-lg shadow-rose-600/30 transition-all">🇮🇳 देश</button>
                <button onclick="changeCategory('WORLD', this)" class="nav-btn px-4 py-1.5 text-xs md:text-sm font-bold rounded-full bg-slate-800 hover:bg-slate-700 text-slate-300 transition-all">🌍 दुनिया</button>
                <button onclick="changeCategory('CRYPTO', this)" class="nav-btn px-4 py-1.5 text-xs md:text-sm font-bold rounded-full bg-slate-800 hover:bg-slate-700 text-slate-300 transition-all">🪙 क्रिप्टो</button>
                <button onclick="changeCategory('SPORTS', this)" class="nav-btn px-4 py-1.5 text-xs md:text-sm font-bold rounded-full bg-slate-800 hover:bg-slate-700 text-slate-300 transition-all">🏆 खेल</button>
                <button onclick="changeCategory('ENTERTAINMENT', this)" class="nav-btn px-4 py-1.5 text-xs md:text-sm font-bold rounded-full bg-slate-800 hover:bg-slate-700 text-slate-300 transition-all">🎬 बॉलीवुड</button>
                <button onclick="changeCategory('TECH', this)" class="nav-btn px-4 py-1.5 text-xs md:text-sm font-bold rounded-full bg-slate-800 hover:bg-slate-700 text-slate-300 transition-all">💻 टेक</button>
            </div>
        </nav>
    </header>

    <!-- Breaking News Ticker -->
    <div class="bg-gradient-to-r from-rose-600 via-rose-700 to-slate-900 text-white py-2 px-4 shadow-md">
        <div class="max-w-7xl mx-auto flex items-center gap-3">
            <span class="bg-white text-rose-700 text-[10px] md:text-xs font-black px-2 py-0.5 rounded shadow tracking-wider uppercase">ब्रेकिंग</span>
            <div id="ticker" class="truncate text-xs md:text-sm font-medium text-slate-100">ताज़ा लाइव खबरें लोड हो रही हैं...</div>
        </div>
    </div>

    <!-- Main Section -->
    <main class="max-w-7xl mx-auto px-4 py-6">
        
        <!-- Hero Banner -->
        <div id="hero-banner" class="mb-8 hidden"></div>

        <!-- Section Title -->
        <div class="flex justify-between items-center mb-6">
            <h2 id="category-title" class="text-lg md:text-2xl font-black text-white flex items-center gap-2">
                <span class="w-1.5 h-6 bg-rose-500 rounded-full"></span>
                मुख्य समाचार
            </h2>
            <span id="news-count" class="text-xs bg-slate-800 text-slate-400 border border-slate-700 px-3 py-1 rounded-full font-bold">0 ख़बरें</span>
        </div>

        <!-- News Cards Grid -->
        <div id="news-list" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            <div class="col-span-full py-16 text-center">
                <div class="inline-block w-8 h-8 border-4 border-rose-500 border-t-transparent rounded-full animate-spin"></div>
                <p class="mt-3 text-slate-400 text-sm font-semibold">ताज़ा खबरें लोड की जा रही हैं...</p>
            </div>
        </div>
    </main>

    <!-- News Modal -->
    <div id="news-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md hidden items-center justify-center p-4 z-50">
        <div class="bg-slate-900 border border-slate-800 rounded-3xl max-w-2xl w-full p-6 relative max-h-[85vh] overflow-y-auto shadow-2xl">
            <button onclick="closeModal()" class="absolute top-4 right-4 bg-slate-800 hover:bg-rose-600 text-slate-300 hover:text-white rounded-full w-9 h-9 flex items-center justify-center transition-all font-bold text-lg">&times;</button>
            
            <div class="relative overflow-hidden rounded-2xl mb-4">
                <img id="modal-img" class="w-full h-60 md:h-80 object-cover" src="" alt="News Detail">
                <span class="absolute top-3 left-3 bg-rose-600 text-white text-xs font-extrabold px-3 py-1 rounded-full shadow">🔴 विस्तृत ख़बर</span>
            </div>

            <h3 id="modal-title" class="text-xl md:text-2xl font-black text-white mb-2 leading-snug"></h3>
            <p id="modal-date" class="text-xs text-rose-400 font-semibold mb-4 border-b border-slate-800 pb-3"></p>
            
            <div id="modal-body" class="text-slate-300 text-sm md:text-base leading-relaxed space-y-3 font-normal"></div>
            
            <div class="mt-6 border-t border-slate-800 pt-4 flex justify-between items-center">
                <a id="whatsapp-share" href="#" target="_blank" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold px-4 py-2.5 rounded-xl transition-all flex items-center gap-1.5">
                    📲 WhatsApp पर शेयर करें
                </a>
                <button onclick="closeModal()" class="bg-rose-600 hover:bg-rose-700 text-white text-xs font-bold px-6 py-2.5 rounded-xl transition-all">बंद करें</button>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-slate-900 border-t border-slate-800 text-slate-400 text-center py-8 mt-16 text-xs">
        <p class="font-extrabold text-sm text-white logo-font tracking-wider">BHARAT NEWS NETWORK</p>
        <p class="text-slate-500 mt-2">© 2026 भारत न्यूज़ | सभी अधिकार सुरक्षित</p>
    </footer>

    <!-- JS Engine -->
    <script>
        const feeds = {
            'MAIN': [
                'https://news.google.com/rss?hl=hi&gl=IN&ceid=IN:hi',
                'https://news.google.com/rss/search?q=भारत+न्यूज़&hl=hi&gl=IN&ceid=IN:hi'
            ],
            'WORLD': [
                'https://news.google.com/rss/search?q=अंतर्राष्ट्रीय+समाचार+OR+विश्व+OR+World+News&hl=hi&gl=IN&ceid=IN:hi'
            ],
            'CRYPTO': [
                'https://news.google.com/rss/search?q=crypto+OR+bitcoin+OR+ethereum&hl=hi&gl=IN&ceid=IN:hi'
            ],
            'SPORTS': [
                'https://news.google.com/rss/headlines/section/topic/SPORTS?hl=hi&gl=IN&ceid=IN:hi'
            ],
            'ENTERTAINMENT': [
                'https://news.google.com/rss/headlines/section/topic/ENTERTAINMENT?hl=hi&gl=IN&ceid=IN:hi'
            ],
            'TECH': [
                'https://news.google.com/rss/headlines/section/topic/TECHNOLOGY?hl=hi&gl=IN&ceid=IN:hi'
            ]
        };

        const imagePool = [
            'https://images.unsplash.com/photo-1504711434969-e33886168f5c?auto=format&fit=crop&w=800&q=80',
            'https://images.unsplash.com/photo-1585829365295-ab7cd400c167?auto=format&fit=crop&w=800&q=80',
            'https://images.unsplash.com/photo-1495020689067-958852a7765e?auto=format&fit=crop&w=800&q=80',
            'https://images.unsplash.com/photo-1526778548025-fa2f459cd5c1?auto=format&fit=crop&w=800&q=80',
            'https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&w=800&q=80',
            'https://images.unsplash.com/photo-1461896836934-ffe607ba8211?auto=format&fit=crop&w=800&q=80',
            'https://images.unsplash.com/photo-1621416894569-0f39ed31d247?auto=format&fit=crop&w=800&q=80',
            'https://images.unsplash.com/photo-1588681664899-f142ff2dc9b1?auto=format&fit=crop&w=800&q=80'
        ];

        let currentItems = [];
        let currentCategory = 'MAIN';

        function getDynamicImage(title) {
            let hash = 0;
            for (let i = 0; i < title.length; i++) {
                hash = title.charCodeAt(i) + ((hash << 5) - hash);
            }
            return imagePool[Math.abs(hash) % imagePool.length];
        }

        function extractImage(item) {
            if (item.thumbnail && item.thumbnail.startsWith('http')) return item.thumbnail;
            if (item.enclosure && item.enclosure.link) return item.enclosure.link;
            const match = item.description ? item.description.match(/<img[^>]+src=["']([^"']+)["']/i) : null;
            return (match && match[1]) ? match[1] : getDynamicImage(item.title);
        }

        function cleanText(html) {
            if (!html) return 'इस खबर का विस्तृत विवरण जल्द उपलब्ध होगा।';
            let text = html.replace(/<a\b[^>]*>(.*?)<\/a>/gi, '$1').replace(/<img[^>]*>/gi, '');
            return text.length > 5 ? text : 'ताज़ा लाइव अपडेट्स के लिए हमारे साथ बने रहें।';
        }

        // Optimized Fresh fetchFeed with Cache-Busting
        async function fetchFeed(url) {
            try {
                // Added Date.now() timestamp to force fresh RSS fetch every single time
                const apiUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(url)}&_t=${Date.now()}`;
                const res = await fetch(apiUrl);
                const data = await res.json();
                return data.status === 'ok' ? data.items : [];
            } catch (e) {
                console.error('Feed Fetch Error:', e);
                return [];
            }
        }

        async function loadNews(categoryKey = 'MAIN') {
            currentCategory = categoryKey;
            const newsList = document.getElementById('news-list');
            const heroBanner = document.getElementById('hero-banner');
            
            newsList.innerHTML = `
                <div class="col-span-full py-16 text-center">
                    <div class="inline-block w-8 h-8 border-4 border-rose-500 border-t-transparent rounded-full animate-spin"></div>
                    <p class="mt-3 text-slate-400 text-sm font-semibold">ताज़ा खबरें फ़ेच हो रही हैं...</p>
                </div>`;
            heroBanner.classList.add('hidden');

            const urls = feeds[categoryKey] || feeds['MAIN'];
            const fetchPromises = urls.map(url => fetchFeed(url));
            const results = await Promise.all(fetchPromises);
            
            let combined = results.flat();
            
            // Filter duplicates by title
            const seen = new Set();
            currentItems = combined.filter(item => {
                const isDuplicate = seen.has(item.title);
                seen.add(item.title);
                return !isDuplicate;
            }).slice(0, 50);

            document.getElementById('news-count').innerText = `${currentItems.length} ख़बरें`;

            if (currentItems.length > 0) {
                document.getElementById('ticker').innerText = currentItems[0].title;
                
                // Hero Top Story
                const heroItem = currentItems[0];
                heroBanner.innerHTML = `
                    <div onclick="openModal(0)" class="group cursor-pointer relative bg-slate-900 rounded-3xl overflow-hidden border border-slate-800 shadow-2xl hover:border-rose-500/50 transition-all duration-300">
                        <div class="relative h-72 md:h-96 overflow-hidden">
                            <img src="${extractImage(heroItem)}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500 opacity-80" alt="Hero News">
                            <div class="absolute inset-0 bg-gradient-to-t from-slate-950 via-slate-950/40 to-transparent"></div>
                        </div>
                        <div class="absolute bottom-0 left-0 right-0 p-6 md:p-8">
                            <span class="bg-rose-600 text-white text-xs font-black px-3 py-1 rounded-full uppercase tracking-wider shadow">🔥 टॉप स्टोरी</span>
                            <h3 class="font-extrabold text-xl md:text-3xl text-white mt-2 leading-snug group-hover:text-rose-400 transition-colors">${heroItem.title}</h3>
                            <p class="text-xs text-slate-400 mt-2 font-medium">${new Date(heroItem.pubDate).toLocaleString('hi-IN')}</p>
                        </div>
                    </div>
                `;
                heroBanner.classList.remove('hidden');

                // Cards Render
                newsList.innerHTML = currentItems.slice(1).map((item, index) => {
                    const actualIndex = index + 1;
                    return `
                        <div onclick="openModal(${actualIndex})" class="group cursor-pointer bg-slate-900 border border-slate-800/80 hover:border-rose-500/40 rounded-2xl overflow-hidden shadow-lg hover:-translate-y-1 transition-all duration-300 flex flex-col justify-between">
                            <div>
                                <div class="relative h-48 overflow-hidden bg-slate-950">
                                    <img src="${extractImage(item)}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500 opacity-90" alt="News Image">
                                </div>
                                <div class="p-5">
                                    <h3 class="font-bold text-base text-slate-100 group-hover:text-rose-400 transition-colors line-clamp-2 leading-snug">${item.title}</h3>
                                    <p class="text-xs text-slate-500 mt-3 font-medium">${new Date(item.pubDate).toLocaleString('hi-IN')}</p>
                                </div>
                            </div>
                            <div class="px-5 pb-5">
                                <span class="block w-full text-center bg-slate-800/80 group-hover:bg-rose-600 text-slate-300 group-hover:text-white font-bold text-xs py-2.5 rounded-xl border border-slate-700/50 group-hover:border-rose-500 transition-all">विस्तार से पढ़ें &rarr;</span>
                            </div>
                        </div>
                    `;
                }).join('');
            } else {
                newsList.innerHTML = '<p class="text-rose-500 text-center col-span-full py-10 font-bold">खबरें लोड नहीं हो सकीं। कृपया रीफ़्रेश बटन पर क्लिक करें।</p>';
            }
        }

        function openModal(index) {
            const item = currentItems[index];
            if (!item) return;

            document.getElementById('modal-img').src = extractImage(item);
            document.getElementById('modal-title').innerText = item.title;
            document.getElementById('modal-date').innerText = new Date(item.pubDate).toLocaleString('hi-IN');
            document.getElementById('modal-body').innerHTML = cleanText(item.description);

            // WhatsApp Share Link
            const shareText = encodeURIComponent(`🔴 ${item.title}\n\nपूरी खबर पढ़ें हमारी वेबसाइट पर:\n${window.location.href}`);
            document.getElementById('whatsapp-share').href = `https://api.whatsapp.com/send?text=${shareText}`;

            const modal = document.getElementById('news-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeModal() {
            const modal = document.getElementById('news-modal');
            modal.classList.remove('flex');
            modal.classList.add('hidden');
        }

        function changeCategory(key, element) {
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.remove('bg-rose-600', 'text-white', 'shadow-lg', 'shadow-rose-600/30');
                btn.classList.add('bg-slate-800', 'text-slate-300');
            });
            element.classList.remove('bg-slate-800', 'text-slate-300');
            element.classList.add('bg-rose-600', 'text-white', 'shadow-lg', 'shadow-rose-600/30');

            document.getElementById('category-title').innerText = element.innerText;
            loadNews(key);
        }

        // Initial Load
        document.addEventListener('DOMContentLoaded', () => loadNews('MAIN'));
    </script>
</body>
</html>
