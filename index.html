<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>भारत न्यूज़ | ताज़ा ख़बरें</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800">

    <header class="bg-white p-4 shadow border-b-2 border-red-600">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <h1 class="text-3xl font-black text-red-600">🔴 भारत <span class="text-gray-900">न्यूज़</span></h1>
            <span class="text-xs text-green-600 font-bold bg-green-100 px-2 py-1 rounded">● लाइव</span>
        </div>
    </header>

    <div class="bg-red-600 text-white py-2 px-4 font-bold text-sm">
        <div class="max-w-4xl mx-auto flex items-center gap-2">
            <span class="bg-white text-red-600 text-xs px-2 py-0.5 rounded uppercase">ब्रेकिंग</span>
            <div id="ticker" class="truncate font-normal">ताज़ा खबरें लोड हो रही हैं...</div>
        </div>
    </div>

    <main class="max-w-4xl mx-auto p-4">
        <h2 class="text-xl font-bold mb-4 border-l-4 border-red-600 pl-2">ताज़ा समाचार</h2>
        <div id="news-list" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <p class="text-gray-500 col-span-2 text-center py-6">खबरें लोड हो रही हैं...</p>
        </div>
    </main>

    <footer class="bg-gray-900 text-white text-center py-6 mt-8 text-sm">
        <p class="font-bold text-red-500">🔴 भारत न्यूज़ नेटवर्क</p>
    </footer>

    <script>
        async function loadNews() {
            const rssUrl = encodeURIComponent('https://news.google.com/rss?hl=hi&gl=IN&ceid=IN:hi');
            const apiUrl = `https://api.rss2json.com/v1/api.json?rss_url=${rssUrl}`;
            try {
                const res = await fetch(apiUrl);
                const data = await res.json();
                if (data.status === 'ok' && data.items.length > 0) {
                    document.getElementById('ticker').innerText = data.items[0].title;
                    document.getElementById('news-list').innerHTML = data.items.slice(0, 12).map(item => `
                        <div class="bg-white p-4 rounded-lg shadow hover:shadow-md border-l-4 border-red-600 flex flex-col justify-between">
                            <div>
                                <h3 class="font-bold text-base text-gray-900 mb-2">${item.title}</h3>
                                <p class="text-xs text-gray-500 mb-3">${new Date(item.pubDate).toLocaleString('hi-IN')}</p>
                            </div>
                            <a href="${item.link}" target="_blank" class="text-xs text-red-600 font-bold hover:underline">पूरी खबर पढ़ें &rarr;</a>
                        </div>
                    `).join('');
                }
            } catch (e) {
                document.getElementById('news-list').innerHTML = '<p class="text-red-500 text-center col-span-2">खबरें लोड नहीं हो सकीं।</p>';
            }
        }
        document.addEventListener('DOMContentLoaded', loadNews);
    </script>
</body>
</html>
